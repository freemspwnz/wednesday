[sources.docker_logs]
type = "docker_logs"
docker_host = "unix:///var/run/docker.sock"
include_containers = ["wednesday"]

[transforms.parse_loguru]
type = "remap"
inputs = ["docker_logs"]
source = '''
  parsed, err = parse_json(string!(.message))
  if err != null {
    abort
  }

  .record = parsed.record
  .service = string(.record.extra.service) ?? "unknown"
  .env = string(.record.extra.env) ?? "unknown"
  .level = string(.record.level.name) ?? "INFO"
  .message = string(.record.message) ?? string!(parsed.text)
'''

[sinks.loki]
type = "loki"
inputs = ["parse_loguru"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.service = "{{ service }}"
labels.env = "{{ env }}"
labels.level = "{{ level }}"
