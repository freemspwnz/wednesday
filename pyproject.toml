[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wednesday"
version = "7.6.0"
description = "Telegram bot generating Wednesday frog meme images."
readme = "README.md"
license = "MIT"
authors = [{ name = "freemspwnz" }]
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.17.0,<4.0.0",
  "httpx2[http2]>=2.7.0,<3.0.0",
  "redis>=7.4.0,<8.0.0",
  "asyncpg>=0.31.0,<0.32.0",
  "sqlalchemy[asyncio]>=2.0.44,<3.0.0",
  "alembic>=1.18.4,<2.0.0",
  "greenlet>=3.4.0,<4.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "pydantic-settings>=2.14.1,<3.0.0",
  "prometheus-client>=0.23.1,<0.24.0",
  "loguru>=0.7.3,<0.8.0",
  "tenacity>=9.1.4,<10.0.0",
  "asyncbreaker>=2.1.0,<3.0.0",
  "limits>=5.8.0,<6.0.0",
  "uuid-utils>=0.17.0,<0.18.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2.0.0",
  "types-pyyaml>=6.0.12.20260518",
  "pytest>=9.0.0,<10.0.0",
  "pytest-asyncio>=1.3.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "httpx2-pytest>=1.0.1,<2.0.0",
  "ruff>=0.7.1,<0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "wednesday/app",
  "wednesday/domain",
  "wednesday/infra",
  "wednesday/presentation",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "__pycache__",
]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["E","F","W","B","C4","I","ANN","UP","RUF","PLE","PLR","PLW","COM"]
ignore = [
  "RUF001","RUF002","RUF003",
  "PLR0911","PLR0912","PLR0914",
  "COM812","TID252","W293",
]
fixable = ["ALL"]
unfixable = ["B"]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["app", "domain", "infra", "presentation", "tests"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401", "PLR6301", "RUF029", "PLR2004"]

[tool.ruff.format]
preview = true
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_no_return = true
no_implicit_optional = true
strict_equality = true
mypy_path = "wednesday"
plugins = ['pydantic.mypy']

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
markers = [
  "unit: fast module tests without external dependencies",
  "integration: integration tests with Postgres/Redis",
  "db: tests demand Postgres",
  "redis: tests demand Redis",
  "e2e: end-to-end scenario with external services",
  "infra: infra/diagnose checks",
  "slow: slow tests",
]
addopts = "-v -ra --tb=short --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["wednesday", "tests"]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning"
]
