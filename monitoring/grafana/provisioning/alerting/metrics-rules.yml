apiVersion: 1

groups:
  - orgId: 1
    name: wednesday-metrics
    folder: "Metrics"
    interval: 1m
    rules:
      - uid: exporter-down
        title: "ExporterDown"
        condition: C
        data:
          - refId: A
            datasourceUid: vm_ds
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: up == 0
              queryType: timeSeriesQuery
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: and
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Target {{ $labels.job }} недоступен"

      - uid: retry-failures
        title: "RetryFailures"
        condition: C
        data:
          - refId: A
            datasourceUid: vm_ds
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(wednesday_retry_attempts_total{status="failed"}[5m])) > 0
              queryType: timeSeriesQuery
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: and
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Исчерпаны retry-попытки"

      - uid: circuit-breaker-open
        title: "CircuitBreakerOpen"
        condition: C
        data:
          - refId: A
            datasourceUid: vm_ds
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: max by (name) (wednesday_cb_state) == 1
              queryType: timeSeriesQuery
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: and
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Circuit breaker {{ $labels.name }} открыт"

      - uid: rate-limit-failures
        title: "RateLimitFailures"
        condition: C
        data:
          - refId: A
            datasourceUid: vm_ds
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(wednesday_rl_calls_total{result="failure"}[5m])) > 0
              queryType: timeSeriesQuery
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: and
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Срабатывания rate limiter"

      - uid: sqla-errors
        title: "SQLAErrors"
        condition: C
        data:
          - refId: A
            datasourceUid: vm_ds
            queryType: timeSeriesQuery
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(wednesday_sqlalchemy_errors_total[5m])) > 0
              queryType: timeSeriesQuery
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: threshold
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: and
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Ошибки SQLAlchemy-запросов"
