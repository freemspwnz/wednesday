name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linting and formatting checks (parallel)
  # ============================================================================

  lint:
    uses: ./.github/workflows/ruff-lint.yml
    with:
      python-version: ${{ vars.PYTHON_VERSION }}

  format:
    uses: ./.github/workflows/ruff-format.yml
    with:
      python-version: ${{ vars.PYTHON_VERSION }}

  mypy:
    uses: ./.github/workflows/mypy.yml
    with:
      python-version: ${{ vars.PYTHON_VERSION }}

  actionlint:
    uses: ./.github/workflows/actionlint.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/dependency-review.yml

  # ============================================================================
  # Additional checks (parallel to tests)
  # ============================================================================

  monitoring:
    uses: ./.github/workflows/monitoring.yml

  loki-dashboards:
    uses: ./.github/workflows/loki.yml

  # ============================================================================
  # Unified set of all Pytest tests
  # ============================================================================

  pytest:
    uses: ./.github/workflows/pytest.yml
    with:
      python-version: ${{ vars.PYTHON_VERSION }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Docker image build and push to GHCR
  # ============================================================================

  docker-build:
    name: Docker image (release tags only)
    needs: [lint, format, mypy, actionlint, pytest, monitoring, loki-dashboards]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: wednesday

  # ============================================================================
  # GitHub Release creation
  # ============================================================================

  github-release:
    name: GitHub Release
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/gh-release.yml
